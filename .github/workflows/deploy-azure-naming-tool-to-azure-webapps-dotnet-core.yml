name: Azure Naming Tool - Build and deploy to an Azure Web App

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'src/AzureNamingTool.csproj'
  # Choose the right runtime identifier for your App Service plan:
  #   Windows App Service => win-x64
  #   Linux App Service   => linux-x64
  RUNTIME_ID: 'linux-x64'

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      secrets-valid: ${{ steps.secrets-valid.outputs.isvalid }}
    steps:
      - uses: actions/checkout@v4
      - id: secrets-valid
        env:
          azure-webapp-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          azure-webapp-publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        if: (env.azure-webapp-name != null && env.azure-webapp-publish-profile != null)
        run: echo 'isvalid=true' >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: [check-secrets]
    if: needs.check-secrets.outputs.secrets-valid == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" -c Release --no-restore

      # Self-contained publish ensures the .NET 10 runtime is included,
      # preventing "runtime not installed" issues on App Service.
      # If you are 100% sure the target worker has .NET 10 runtime preinstalled
      # and you want smaller packages, you can switch to framework-dependent:
      #   --self-contained false   (and remove -r)
      - name: Publish (self-contained, produces api/, build/, config/, appsettings.json, web.config)
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" -c Release \
            -o ./publish \
            -r ${{ env.RUNTIME_ID }} \
            --self-contained true \
            /p:PublishTrimmed=false

      - name: Show publish output (sanity check)
        run: |
          echo "Publish folder contents:"
          ls -la ./publish
          echo "Expect to see: api/, build/, config/, appsettings.json, web.config (ANT 5.x layout)"

      - name: Upload artifact for deploy
        uses: actions/upload-artifact@v4
        with:
          name: ant-publish
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: [build, check-secrets]
    if: needs.check-secrets.outputs.secrets-valid == 'true'
    environment:
      name: 'Development'   # GitHub environment label only; not an Azure slot
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ant-publish
          path: ./publish

      - name: List files to be deployed (sanity check)
        run: ls -la ./publish

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
